name: Cargo runner scratch qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scratch:
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-ubuntu-24-04-16, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Find a local filesystem for the full Linux test suite
        shell: bash
        run: |
          set -eu
          for path in "$RUNNER_TEMP" /tmp /mnt /dev/shm /var/tmp /cache; do
            if test -d "$path"; then
              printf 'QA-FILESYSTEM %s ' "$path"
              findmnt --bytes -T "$path" -n -o TARGET,FSTYPE,SIZE,AVAIL
            fi
          done
          findmnt --bytes -rn -t ext4,xfs,btrfs -o TARGET,FSTYPE,SIZE,AVAIL | awk '$1 == "/" || $1 ~ /^\/(mnt|home\/runner|cache|work|tmp|var\/tmp)(\/|$)/ {print "QA-LOCAL", $0}'
          if test "${{ matrix.runner }}" = namespace-profile-ubuntu-24-04-16; then
            scratch="$RUNNER_TEMP/ohm-cargo-ext4-probe"
            mkdir -p "$scratch/fs"
            truncate --size=64M "$scratch/test.img"
            mkfs.ext4 -q -F "$scratch/test.img"
            if sudo -n mount -o loop,nosuid,nodev "$scratch/test.img" "$scratch/fs" 2>"$scratch/mount.err"; then
              trap 'sudo -n umount "$scratch/fs"' EXIT
              sudo -n chown "$(id -u):$(id -g)" "$scratch/fs"
              cp /bin/true "$scratch/fs/check"
              "$scratch/fs/check"
              test "$(stat -c %d "$scratch/fs")" = "$(stat -c %d "$scratch/fs/check")"
              echo "QA-LOOP ext4 mounted with stable device IDs and executable files"
            else
              printf 'QA-LOOP unavailable: '; head -c 500 "$scratch/mount.err"; printf '\n'
            fi
          else
            for path in /usr/local/lib/android /usr/local/.ghcup /opt/ghc /usr/share/dotnet; do
              if test -d "$path"; then printf 'QA-IMAGE-TOOLS '; du -sx --block-size=1 "$path"; fi
            done
          fi
