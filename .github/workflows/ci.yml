name: Investigate Cargo GC test runner
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gc:
    name: ${{ matrix.role }} GC on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - role: parent
          head: 2d44bd4aa68b9ba32cacb5a384ecc18fa5e7553c
          runner: namespace-profile-ubuntu-24-04-16
        - role: parent
          head: 2d44bd4aa68b9ba32cacb5a384ecc18fa5e7553c
          runner: ubuntu-24.04
        - role: candidate
          head: 58f94004f2cf0790be76db99a49f725a3611e5a6
          runner: namespace-profile-ubuntu-24-04-16
        - role: candidate
          head: 58f94004f2cf0790be76db99a49f725a3611e5a6
          runner: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE: ${{ matrix.head }}
      RUST_VERSION: 1.99.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '1'
      CARGO_PROFILE_DEV_DEBUG: '1'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ matrix.head }}
    - name: Verify source and inventory filesystems
      run: "set -eu\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE\"\nrustup toolchain install \"$RUST_VERSION\" --profile minimal\nmkdir -p \"$RUNNER_TEMP/results\"\
        \ \"$RUNNER_TEMP/explicit-gc\" /dev/shm/ohm-gc-job\necho \"CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-gc-qa-target\" >> \"$GITHUB_ENV\"\n{\n\
        \  id -u\n  uname -srv\n  for where in /tmp \"$RUNNER_TEMP/explicit-gc\" /dev/shm/ohm-gc-job; do\n    realpath \"$where\"\n    findmnt
        -n -o TARGET,FSTYPE -T \"$where\"\n    stat -c '%n %d %i %a' \"$where\"\n    ls -ld \"$where\"\n  done\n} > \"$RUNNER_TEMP/results/filesystems\"\
        \n"
    - name: Run unmodified GC tests across three temp locations
      run: "set -eu\ncargo +\"$RUST_VERSION\" test --locked -p cargo --lib --no-run --message-format=json > \"$RUNNER_TEMP/results/products.json\"\
        \nexe=$(jq -rs '[.[] | select(.reason==\"compiler-artifact\" and .target.name==\"cargo\" and (.target.kind | index(\"lib\")) and .profile.test
        and .executable)] | if length==1 then .[0].executable else error(\"test binary identity\") end' \"$RUNNER_TEMP/results/products.json\"\
        )\nsha256sum \"$exe\" > \"$RUNNER_TEMP/results/test-executable.sha256\"\nfor lane in original runner_tmp tmpfs; do\n  (\n    case \"$lane\"\
        \ in\n      runner_tmp) export TMPDIR=\"$RUNNER_TEMP/explicit-gc\" ;;\n      tmpfs) export TMPDIR=/dev/shm/ohm-gc-job ;;\n    esac\n \
        \   \"$exe\" 'workspace::build_cache_gc' > \"$RUNNER_TEMP/results/$lane.txt\" 2>&1 && status=0 || status=$?\n    echo \"$status\" > \"\
        $RUNNER_TEMP/results/$lane.status\"\n    grep '^test result:' \"$RUNNER_TEMP/results/$lane.txt\"\n  )\ndone\n"
    - name: Capture the reason for retaining the first fixture
      run: "set -eu\npython3 - <<'PY'\nfrom pathlib import Path\np=Path('src/workspace/build_cache_gc/mod.rs')\ns=p.read_text();start=s.index('fn
        collect_with_lock_budget(',s.index('mod tests {'));at=s.index('        Ok(summary)',start)\ns=s[:at]+'        eprintln!(\"GC_OBS busy={:?}
        skipped={:?} errors={:?} retained={} files={}\", summary.busy,summary.skipped,summary.errors,summary.retained,summary.counts.files);'+chr(10)+s[at:]\n\
        p.write_text(s)\nPY\ngit diff -- src/workspace/build_cache_gc/mod.rs > \"$RUNNER_TEMP/results/observation.patch\"\ntest \"$(git diff --numstat)\"\
        \ = \"$(printf '1\t0\tsrc/workspace/build_cache_gc/mod.rs')\"\ncargo +\"$RUST_VERSION\" test --locked -p cargo --lib workspace::build_cache_gc::tests::legacy_cleanup_needs_no_records_or_age_and_preview_is_read_only
        -- --exact --nocapture > \"$RUNNER_TEMP/results/test-only-diag.txt\" 2>&1 && code=0 || code=$?\necho \"$code\" > \"$RUNNER_TEMP/results/test-only-diag.status\"\
        \ngrep 'GC_OBS' \"$RUNNER_TEMP/results/test-only-diag.txt\"\n"
    - name: Keep original test results and source-only diagnostic
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gc-${{ matrix.role }}-${{ matrix.runner }}
        path: ${{ runner.temp }}/results
        retention-days: 7
        if-no-files-found: error
