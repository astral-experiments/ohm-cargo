name: Linux CI for shared cache mount handling
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_VERSION: 1.99.0

jobs:
  cargo-tests:
    name: Full Linux Cargo and pinned Ohm suites
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: depot-ubuntu-24.04-16
          other: i686-unknown-linux-gnu
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
      with:
        ref: c7f394c8c9aaef1272c621ff11d77dcf569ed94b
    - name: Verify exact sources and native scratch storage
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = c7f394c8c9aaef1272c621ff11d77dcf569ed94b
        receipt="$RUNNER_TEMP/full-cargo-306"
        mkdir -p "$receipt"
        exec > >(tee "$receipt/storage-before.txt") 2>&1
        git rev-parse HEAD HEAD^{tree}
        uname -a
        df -hT "$RUNNER_TEMP" /dev/shm
        findmnt -rn -t tmpfs,ext4 -o TARGET,FSTYPE,OPTIONS
        # The unit suite uses std::env::temp_dir. Integration tests use Cargo's
        # compile-time CARGO_TARGET_TMPDIR, which is inside this exact target path.
        target="$RUNNER_TEMP/cargo-tests"
        mkdir -m 0700 "$target"
        root_free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
        (( root_free >= 100 * 1024 * 1024 * 1024 ))
        read -r mem_kib < <(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
        printf 'MemAvailable_kib=%s\n' "$mem_kib"
        image="$RUNNER_TEMP/cargo-306-native.ext4"
        truncate -s 72G "$image"
        mkfs.ext4 -q -m 0 "$image"
        if sudo mount -o loop,exec,nodev,nosuid "$image" "$target"; then
          echo 'Using a job-private ext4 filesystem'
        else
          (( mem_kib >= 40 * 1024 * 1024 ))
          sudo mount -t tmpfs -o size=48G,mode=0700,exec,nodev,nosuid tmpfs "$target"
          echo 'Using a job-private executable tmpfs'
        fi
        sudo chown "$(id -u):$(id -g)" "$target"
        fixture="$target/unit-fixture"
        mkdir -m 0700 "$fixture" "$target/tmp"
        kind=$(findmnt -T "$target" -n -o FSTYPE)
        [[ $kind == ext4 || $kind == tmpfs ]]
        target_free=$(df -PB1 "$target" | awk 'NR==2 {print $4}')
        (( target_free >= 40 * 1024 * 1024 * 1024 ))
        for scratch in "$fixture" "$target/tmp"; do
          printf '#!/bin/sh\nexit 0\n' > "$scratch/exec-probe"
          chmod +x "$scratch/exec-probe"
          "$scratch/exec-probe"
          test "$(stat -c %d "$target")" = "$(stat -c %d "$scratch/exec-probe")"
          rm "$scratch/exec-probe"
        done
        findmnt -T "$fixture" -o TARGET,FSTYPE,OPTIONS
        df -PB1 "$target" "$target/tmp" "$fixture"
        printf 'TMPDIR=%s\n' "$fixture" >> "$GITHUB_ENV"
        printf '%s\n' "$fixture" > "$receipt/fixture-path"
    - name: Install Rust
      run: |
        # Keep compiled-in test scratch paths outside this repository and any
        # `target` component, for Git discovery and automatic shared-build admission.
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-tests" >> "$GITHUB_ENV"
        rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
        rustup target add --toolchain "$RUST_VERSION" "${{ matrix.other }}" wasm32-unknown-unknown
    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y gcc-multilib libsecret-1-0 libsecret-1-dev
    - name: Run Cargo unit and integration tests
      run: cargo +"$RUST_VERSION" test -p cargo
    - name: Install Ohm for shared-registry integration coverage
      if: runner.os == 'Linux'
      env:
        OHM_VERSION: ohm-1.97.1-16
        OHM_INSTALLER_SHA256: e8f33de7d5a2def0205fbde4db499853f44b3444037559637d2d8ff1e6cc92a4
      run: |
        installer="$RUNNER_TEMP/ohm-installer.sh"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "$installer" \
          "https://labs.astral.sh/ohm/releases/$OHM_VERSION/install.sh"
        printf '%s  %s\n' "$OHM_INSTALLER_SHA256" "$installer" | sha256sum --check
        sh "$installer"
    - name: Run shared-registry integration with Ohm
      if: runner.os == 'Linux'
      env:
        RUSTUP_TOOLCHAIN: ohm-1.97.1-16
          # This pinned compiler predates early metadata.
        __CARGO_HEADSTART: no
      run: |
        testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
        if [[ -z "$testsuite" ]]; then
          echo 'compiled Cargo integration test binary was not found' >&2
          exit 1
        fi
        "$testsuite" \
          build_dir::shared_registry_cache_preserves_cross_workspace_reuse_and_private_early_cutoff \
          --exact --nocapture
        "$testsuite" \
          build_dir::shared_registry_cache_avoids_hashing_immutable_public_apis \
          --exact --nocapture
        "$testsuite" \
          check::ohm_preserves_fresh_checks_while_holding_shared_workspace_locks \
          --exact --nocapture
        "$testsuite" \
          check::ohm_locks_fingerprints_before_preserving_established_check_graphs \
          --exact --nocapture
        "$testsuite" \
          check::ohm_skips_cold_ordinary_check_graphs_after_test_builds \
          --exact --nocapture
    - name: Install Ohm for Clippy worktree coverage
      env:
        OHM_VERSION: ohm-1.98.0-9
        OHM_INSTALLER_SHA256: 573e00024783ab952f7c2d629f12f9e0ba61be96843f7e692dc056642a72affe
      run: |
        installer="$RUNNER_TEMP/ohm-clippy-installer.sh"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "$installer" \
          "https://labs.astral.sh/ohm/releases/$OHM_VERSION/install.sh"
        printf '%s  %s\n' "$OHM_INSTALLER_SHA256" "$installer" | shasum -a 256 --check
        sh "$installer"
    - name: Run profile and bundled Clippy worktree tests with Ohm
      env:
        RUSTUP_TOOLCHAIN: ohm-1.98.0-9
          # This pinned compiler predates early metadata.
        __CARGO_HEADSTART: no
      run: |
        toolchain_bin="$(dirname "$(rustup which rustc)")"
        rustup_bin="$(dirname "$(command -v rustup)")"
        # Exclude runner-provided native-tool shims from the trusted-cache fixture.
        export PATH="$toolchain_bin:$rustup_bin:/usr/bin:/bin:/usr/sbin:/sbin"
        rustc -Vv
        clippy-driver -V
        testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
        if [[ -z "$testsuite" ]]; then
          echo 'compiled Cargo integration test binary was not found' >&2
          exit 1
        fi
        # The stable-built testsuite marks these nightly tests ignored at compile time.
        "$testsuite" profiles::ohm_default_debuginfo --include-ignored --nocapture
        for test in \
          worktree_import_requires_cloning \
          bundled_clippy_isolation_defaults_follow_actual_snapshot_cloning \
          bundled_clippy_preserves_ordinary_seeds_without_importing_lint_state \
          clippy_isolation_overrides_are_inherited_and_child_flags_take_precedence \
          forced_clippy_isolation_preserves_compiler_trust_rejections \
          clippy_wrapper_scripts_still_deny_the_whole_seed; do
          "$testsuite" "ohm_worktree::$test" --exact --include-ignored --nocapture
        done
        if [[ "$RUNNER_OS" == Linux ]]; then
          "$testsuite" ohm_linker::ohm_defaults_select_wild_and_allow_lld \
            --exact --include-ignored --nocapture
          "$testsuite" rustflags::ohm_defaults_reexpand_derive_after_native_input_changes \
            --exact --nocapture
        fi

    - name: Record resulting storage and checked-out tree
      if: always()
      run: |
        receipt="$RUNNER_TEMP/full-cargo-306"
        mkdir -p "$receipt"
        {
          git rev-parse HEAD HEAD^{tree}
          git status --porcelain
          df -hT "$RUNNER_TEMP" /dev/shm
          if test -s "$receipt/fixture-path"; then
            df -hT "$(cat "$receipt/fixture-path")"
          fi
        } | tee "$receipt/storage-after.txt"
    - name: Keep source and storage receipts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: full-cargo-306-source-and-storage
        path: ${{ runner.temp }}/full-cargo-306
        if-no-files-found: error
        retention-days: 30
