name: Ready-test runtime rendezvous on release Cargo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: Same Apple runner, two exact Cargo source heads
    runs-on: namespace-profile-macos-15
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PUBLIC_NETWORK_TESTS: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Bind the APFS fixture and upstream 1.99.0
        run: |
          set -euo pipefail
          s=$(mktemp -d "$RUNNER_TEMP/ohm-rc22-ready-XXXXXXXX")
          device=$(df -P "$s" | awk 'END {print $1}')
          fs=$(diskutil info -plist "$device" | python3 -c 'import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())["FilesystemType"])')
          test "$fs" = apfs
          p=$(type -P true); cp "$p" "$s/probe"; "$s/probe"
          mkdir "$s/tmp"
          echo "QA_STORAGE=$fs" >> "$GITHUB_ENV"
          echo "QA_AREA=$s" >> "$GITHUB_ENV"
          echo "TMPDIR=$s/tmp" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.0 --profile minimal
      - name: Run the unmodified 15-second ready-test barrier
        run: python3 -IBu ci/rc22-ready.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc22-ready-native-pair
          path: ${{ runner.temp }}/ready-receipts
          if-no-files-found: warn
          retention-days: 14
