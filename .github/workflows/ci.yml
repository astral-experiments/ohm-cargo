name: Cargo source qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  gc:
    name: GC control and candidate (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-ubuntu-24-04-16, ubuntu-24.04]
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: diagnostics
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2d44bd4aa68b9ba32cacb5a384ecc18fa5e7553c
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3871cbf823b811d3d5d9f59b87fb9df8d6cb9148
          path: candidate
          persist-credentials: false
      - name: Install dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Compare control and candidate
        run: python3 -B diagnostics/ci/ohm-22-gc-qualification.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gc-${{ matrix.runner }}
          path: ${{ runner.temp }}/ohm-22-gc-qualification-logs/*.log
          retention-days: 7
