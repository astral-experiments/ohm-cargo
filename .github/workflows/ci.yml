name: RC22 native marker qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    name: Marker handling (${{ matrix.host }}, ${{ matrix.role }})
    strategy:
      fail-fast: false
      matrix:
        host: [macOS]
        role: [parent, fixed]
    runs-on: ${{ matrix.host == 'macOS' && 'namespace-profile-macos-15' || 'namespace-profile-ubuntu-24-04-16' }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Isolate an actual native fixture filesystem
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$(findmnt -n -T /cache -o FSTYPE)" = ext4
            s=$(sudo mktemp -d "/cache/ohm-rc22-markers-$GITHUB_RUN_ID-$GITHUB_JOB-XXXXXXXX")
            sudo chown "$(id -u):$(id -g)" "$s"
            fs=$(findmnt -n -T "$s" -o FSTYPE,SOURCE)
            sudo apt-get -qq update
            sudo apt-get -qq install -y libsecret-1-dev
          else
            s=$(mktemp -d "$RUNNER_TEMP/ohm-rc22-markers-XXXXXXXX")
            device=$(df -P "$s" | awk 'END {print $1}')
            fs=$(diskutil info -plist "$device" | python3 -c 'import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())["FilesystemType"])')
            test "$fs" = apfs
          fi
          mkdir "$s/tmp" "$s/cargo-tests"
          probe=$(type -P true)
          test -f "$probe" && test -x "$probe"
          cp "$probe" "$s/probe"; "$s/probe"
          echo "QA_STORAGE=$fs" >> "$GITHUB_ENV"
          echo "TMPDIR=$s/tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$s/cargo-tests" >> "$GITHUB_ENV"
      - name: Install the upstream stable toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Run the three exact physical test cases
        env:
          ROLE: ${{ matrix.role }}
        run: |
          cp ci/rc22-marker-qa.py "$RUNNER_TEMP/run-rc22-marker-qa.py"
          python3 -IBu "$RUNNER_TEMP/run-rc22-marker-qa.py" "$ROLE"
      - name: Publish the original logs and source/ELF checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc22-both-markers-${{ matrix.host }}-${{ matrix.role }}
          path: ${{ runner.temp }}/marker-receipts
          if-no-files-found: warn
          retention-days: 14
