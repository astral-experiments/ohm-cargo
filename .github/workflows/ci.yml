name: Manifest span nightly cross-target checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-cross-target:
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.99.0
      NIGHTLY_VERSION: nightly-2026-08-01
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 16
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fa592baf27578e348059de7fbe0eed50126d1bca
          persist-credentials: false
      - name: Verify the exact production source and host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fa592baf27578e348059de7fbe0eed50126d1bca
          test "$(git rev-parse 'HEAD^{tree}')" = ee6ffdb835f1012d3968f09be6946b88decd92fe
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -z "${CFG_DISABLE_CROSS_TESTS+x}"
          test -z "${RUSTC_BOOTSTRAP+x}"
          mkdir -p "$RUNNER_TEMP/manifest-cross-evidence"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/manifest-cross-evidence/source.txt"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-nightly-cross" >> "$GITHUB_ENV"
      - name: Install the pinned compiler and real cross-target support
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/manifest-cross-evidence"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://static.rust-lang.org/dist/2026-08-01/channel-rust-nightly.toml \
            --output "$evidence/channel-rust-nightly.toml"
          printf '%s  %s\n' \
            f4b63db200deb36a120b27ae085140637ee04af1254891308799225e5afbe8bf \
            "$evidence/channel-rust-nightly.toml" | sha256sum --check
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup toolchain install "$NIGHTLY_VERSION" --profile minimal
          rustup target add --toolchain "$NIGHTLY_VERSION" i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libsecret-1-0 libsecret-1-dev
          rustc +"$NIGHTLY_VERSION" -vV | tee "$evidence/nightly-version.txt"
          rustup target list --toolchain "$NIGHTLY_VERSION" --installed | tee "$evidence/installed-targets.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'manifest-cross-evidence'
          version = (evidence / 'nightly-version.txt').read_text()
          assert version.splitlines()[0] == 'rustc 1.99.0-nightly (ad3d0bc14 2026-07-31)'
          assert '\nhost: x86_64-unknown-linux-gnu\n' in version
          assert '\nrelease: 1.99.0-nightly\n' in version
          assert 'i686-unknown-linux-gnu' in (evidence / 'installed-targets.txt').read_text().splitlines()
          assert 'CFG_DISABLE_CROSS_TESTS' not in os.environ
          assert 'RUSTC_BOOTSTRAP' not in os.environ
          PY
          printf '%s\n' 'fn main() { assert_eq!(std::mem::size_of::<usize>(), 4); println!("I686_SMOKE_OK"); }' > "$evidence/cross-smoke.rs"
          rustc +"$NIGHTLY_VERSION" --crate-name cross_smoke --target i686-unknown-linux-gnu \
            "$evidence/cross-smoke.rs" -o "$RUNNER_TEMP/cross-smoke"
          readelf -h "$RUNNER_TEMP/cross-smoke" | tee "$evidence/cross-smoke-elf.txt"
          grep -Eq 'Class:.*ELF32' "$evidence/cross-smoke-elf.txt"
          "$RUNNER_TEMP/cross-smoke" | tee "$evidence/cross-smoke.stdout"
          grep -Fx I686_SMOKE_OK "$evidence/cross-smoke.stdout"
          sha256sum "$RUNNER_TEMP/cross-smoke" | tee "$evidence/cross-smoke.sha256"
      - name: Build the unchanged testsuite with stable Rust
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CFG_DISABLE_CROSS_TESTS+x}"
          test -z "${RUSTC_BOOTSTRAP+x}"
          unset RUSTC RUSTDOC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          cargo +"$RUST_VERSION" test -p cargo --test testsuite --no-run --locked --message-format=json \
            > "$RUNNER_TEMP/manifest-cross-evidence/test-build.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'manifest-cross-evidence'
          rows = [json.loads(line) for line in (evidence / 'test-build.jsonl').read_text().splitlines()]
          suites = [row['executable'] for row in rows if row.get('reason') == 'compiler-artifact'
                    and row.get('target', {}).get('name') == 'testsuite' and row.get('executable')]
          assert len(suites) == 1 and Path(suites[0]).is_file()
          assert any(row.get('reason') == 'build-finished' and row.get('success') is True for row in rows)
          (evidence / 'testsuite-path.txt').write_text(suites[0] + '\n')
          PY
          sha256sum "$(cat "$RUNNER_TEMP/manifest-cross-evidence/testsuite-path.txt")" \
            "$CARGO_TARGET_DIR/debug/cargo" | tee "$RUNNER_TEMP/manifest-cross-evidence/test-binaries.sha256"
          "$CARGO_TARGET_DIR/debug/cargo" -Vv | tee "$RUNNER_TEMP/manifest-cross-evidence/cargo-under-test.txt"
      - name: Run both exact nightly tests without skips
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CFG_DISABLE_CROSS_TESTS+x}"
          test -z "${RUSTC_BOOTSTRAP+x}"
          unset RUSTC RUSTDOC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          export RUSTUP_TOOLCHAIN="$NIGHTLY_VERSION"
          nightly_bin="$(dirname "$(rustup which --toolchain "$NIGHTLY_VERSION" rustc)")"
          rustup_bin="$(dirname "$(command -v rustup)")"
          export PATH="$nightly_bin:$rustup_bin:/usr/bin:/bin"
          rustc -vV | tee "$RUNNER_TEMP/manifest-cross-evidence/actual-test-rustc.txt"
          cmp "$RUNNER_TEMP/manifest-cross-evidence/nightly-version.txt" \
            "$RUNNER_TEMP/manifest-cross-evidence/actual-test-rustc.txt"
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          assert 'CFG_DISABLE_CROSS_TESTS' not in os.environ
          assert 'RUSTC_BOOTSTRAP' not in os.environ
          assert os.uname().sysname == 'Linux' and os.uname().machine == 'x86_64'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'manifest-cross-evidence'
          suite = (evidence / 'testsuite-path.txt').read_text().strip()
          selectors = ['pub_priv::dependency_location_in_target_table',
                       'pub_priv::dependency_location_in_target_table_with_cfg']
          results = []
          for index, selector in enumerate(selectors):
              # A separate process resets the cross-compile helper's HAVE_WARNED state.
              argv = [suite, selector, '--exact', '--include-ignored', '--test-threads=1', '--color=never']
              result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, check=False)
              (evidence / f'test-{index}.log').write_text(result.stdout)
              print(result.stdout, end='', flush=True)
              assert result.returncode == 0
              assert re.search(r'^running 1 test$', result.stdout, re.M)
              assert re.search(r'^test ' + re.escape(selector) + r' \.\.\. ok$', result.stdout, re.M)
              assert re.search(r'^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;', result.stdout, re.M)
              results.append({'selector': selector, 'returncode': 0, 'passed': 1, 'failed': 0, 'ignored': 0,
                              'log_sha256': hashlib.sha256(result.stdout.encode()).hexdigest()})
          report = {'state': 'passed-two-exact-cross-target-selectors', 'source_commit': 'fa592baf27578e348059de7fbe0eed50126d1bca',
                    'source_tree': 'ee6ffdb835f1012d3968f09be6946b88decd92fe', 'nightly': os.environ['RUSTUP_TOOLCHAIN'],
                    'cross_disable_variable_absent': True, 'real_i686_link_and_execution_passed': True,
                    'separate_process_per_selector': True, 'results': results}
          (evidence / 'result.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print('CROSS_TARGET_RESULT=' + json.dumps(report, sort_keys=True), flush=True)
          PY
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse 'HEAD^{tree}')" = ee6ffdb835f1012d3968f09be6946b88decd92fe
      - name: Retain selective correctness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-nightly-cross-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest-cross-evidence
          if-no-files-found: error
          retention-days: 30
