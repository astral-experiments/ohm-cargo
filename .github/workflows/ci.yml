name: Exact supplemental Linux CI for Cargo 302 and 307
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: separate-302-307-linux-20261101
  cancel-in-progress: false
env:
  RUST_VERSION: 1.99.0
jobs:
  p302-cargo-tests:
    name: 302 / Cargo tests (${{ matrix.os }})
    runs-on: namespace-profile-ubuntu-24-04-16
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: depot-ubuntu-24.04-16
          other: i686-unknown-linux-gnu
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
      with:
        ref: 9a102b4519b40f9034aa40533d92c83583dcb289
        persist-credentials: false
    - name: Verify every physical Cargo source entry and its pinned lockfile
      run: |
        python3 -IB - 9a102b4519b40f9034aa40533d92c83583dcb289 600cea5b6ad055da905e7b9960e4419405b2153f 3114 70addc63e0ff810480ea4d3685e8332b88cc8f246f7bc6ccf36eec787e38467d 1ab5ae50a41ac40d9c26de74bb138425a0073aef 6259fbdaed240f1b65e0106c115a6df98909b574 <<'PY_SOURCE'
        import hashlib,json,os,stat,subprocess,sys
        from pathlib import Path
        head,tree,count,ledger,lock,workflow=sys.argv[1:]
        def git(*args):return subprocess.check_output(['git',*args])
        def rev(x):return git('rev-parse',x).decode().strip()
        assert rev('HEAD')==head and rev('HEAD^{tree}')==tree
        assert rev('HEAD:Cargo.lock')==lock and rev('HEAD:.github/workflows/ci.yml')==workflow
        inventory=git('ls-tree','-rz','--full-tree','HEAD')
        assert hashlib.sha256(inventory).hexdigest()==ledger
        rows=inventory.rstrip(b'\0').split(b'\0');assert len(rows)==int(count)
        for row in rows:
            desc,name=row.split(b'\t',1)
            mode,kind,oid=desc.split();assert kind==b'blob'
            path=Path(os.fsdecode(name)); st=path.lstat()
            if mode==b'120000':
                assert stat.S_ISLNK(st.st_mode),name
                body=os.fsencode(os.readlink(path))
            else:
                assert mode in (b'100644',b'100755') and stat.S_ISREG(st.st_mode) and bool(st.st_mode & 0o111)==(mode==b'100755'),name
                body=path.read_bytes()
            actual=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest().encode()
            assert actual==oid,name
        assert not git('status','--porcelain=v1','--untracked-files=no')
        print(json.dumps({'source':head,'tree':tree,'source_entries':len(rows),'tree_inventory_sha256':ledger,'cargo_lock':lock,'original_workflow':workflow},sort_keys=True))
        PY_SOURCE
    - name: Install Rust
      run: |
        # Keep compiled-in test scratch paths outside this repository and any
        # `target` component, for Git discovery and automatic shared-build admission.
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-tests" >> "$GITHUB_ENV"
        rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
        rustup target add --toolchain "$RUST_VERSION" "${{ matrix.other }}" wasm32-unknown-unknown
    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y gcc-multilib libsecret-1-0 libsecret-1-dev
    - name: Admit coherent Linux test storage with the prior verified protocol
      run: |
        #!/usr/bin/env bash
        # Give the unchanged Cargo suite coherent dirent/stat identities on the same runner.
        set -euo pipefail

        base="$RUNNER_TEMP/cargo-ci-native-volume"
        build="$RUNNER_TEMP/cargo-tests"
        test ! -e "$base" && test ! -e "$build"
        mkdir "$base"
        (( $(df --output=avail -B1 "$base" | tail -1) > 64*1024**3 ))
        image="$RUNNER_TEMP/cargo-ci-native.ext4"
        test ! -e "$image"
        truncate -s 32G "$image"
        mkfs.ext4 -q -F -m 0 "$image"
        if sudo -n mount -t ext4 -o loop,exec,nodev,nosuid "$image" "$base"; then
            backend=private-ext4
            sudo -n chown "$(id -u):$(id -g)" "$base"
        elif sudo -n mount -t tmpfs -o size=28G,exec,nodev,nosuid,mode=0755 tmpfs "$base"; then
            backend=private-tmpfs
            sudo -n chown "$(id -u):$(id -g)" "$base"
        else
            backend=existing-tmpfs
            base=$(mktemp -d /dev/shm/cargo-ci-301.XXXXXXXX)
        fi
        mkdir "$base/compiled" "$base/tmp"
        if [[ $backend == existing-tmpfs ]]; then
            ln -s "$base/compiled" "$build"
        else
            mkdir "$build"
            sudo -n mount --bind "$base/compiled" "$build"
        fi
        python3 -IB - "$backend" "$base" "$build" <<'PY'
        import json, os, shutil, subprocess, sys, tempfile
        from pathlib import Path
        backend, base, build = sys.argv[1:]
        report = {'backend':backend,'mounts':{}}
        for path in [Path(base)/'tmp', Path(build)]:
            capacity = shutil.disk_usage(path)
            assert capacity.free >= 22*1024**3
            with tempfile.TemporaryDirectory(dir=path) as tmp:
                p=Path(tmp)
                (p/'dir').mkdir(); shutil.copy2('/bin/true',p/'native')
                subprocess.run([str(p/'native')],check=True)
                entries=list(os.scandir(p)); assert all(e.inode()==os.lstat(e.path).st_ino for e in entries)
                assert len({os.lstat(e.path).st_dev for e in entries}|{p.stat().st_dev}) == 1
            report['mounts'][str(path)] = {'free':capacity.free,'device':path.stat().st_dev,
                'findmnt':subprocess.check_output(['findmnt','-T',str(path),'-n','-o','TARGET,SOURCE,FSTYPE']).decode().strip()}
        assert os.stat(Path(base)/'compiled').st_ino == os.stat(build).st_ino
        assert os.stat(Path(base)/'compiled').st_dev == os.stat(build).st_dev
        print(json.dumps(report,sort_keys=True))
        PY
        echo "TMPDIR=$base/tmp" >> "$GITHUB_ENV"
    - name: Run Cargo unit and integration tests
      run: cargo +"$RUST_VERSION" test -p cargo
    - name: Install Ohm for shared-registry integration coverage
      if: runner.os == 'Linux'
      env:
        OHM_VERSION: ohm-1.97.1-16
        OHM_INSTALLER_SHA256: e8f33de7d5a2def0205fbde4db499853f44b3444037559637d2d8ff1e6cc92a4
      run: |
        installer="$RUNNER_TEMP/ohm-installer.sh"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "$installer" \
          "https://labs.astral.sh/ohm/releases/$OHM_VERSION/install.sh"
        printf '%s  %s\n' "$OHM_INSTALLER_SHA256" "$installer" | sha256sum --check
        sh "$installer"
    - name: Run shared-registry integration with Ohm
      if: runner.os == 'Linux'
      env:
        RUSTUP_TOOLCHAIN: ohm-1.97.1-16
          # This pinned compiler predates early metadata.
        __CARGO_HEADSTART: no
      run: |
        testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
        if [[ -z "$testsuite" ]]; then
          echo 'compiled Cargo integration test binary was not found' >&2
          exit 1
        fi
        "$testsuite" \
          build_dir::shared_registry_cache_preserves_cross_workspace_reuse_and_private_early_cutoff \
          --exact --nocapture
        "$testsuite" \
          build_dir::shared_registry_cache_avoids_hashing_immutable_public_apis \
          --exact --nocapture
        "$testsuite" \
          check::ohm_preserves_fresh_checks_while_holding_shared_workspace_locks \
          --exact --nocapture
        "$testsuite" \
          check::ohm_locks_fingerprints_before_preserving_established_check_graphs \
          --exact --nocapture
        "$testsuite" \
          check::ohm_skips_cold_ordinary_check_graphs_after_test_builds \
          --exact --nocapture
    - name: Install Ohm for Clippy worktree coverage
      env:
        OHM_VERSION: ohm-1.98.0-9
        OHM_INSTALLER_SHA256: 573e00024783ab952f7c2d629f12f9e0ba61be96843f7e692dc056642a72affe
      run: |
        installer="$RUNNER_TEMP/ohm-clippy-installer.sh"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "$installer" \
          "https://labs.astral.sh/ohm/releases/$OHM_VERSION/install.sh"
        printf '%s  %s\n' "$OHM_INSTALLER_SHA256" "$installer" | shasum -a 256 --check
        sh "$installer"
    - name: Run profile and bundled Clippy worktree tests with Ohm
      env:
        RUSTUP_TOOLCHAIN: ohm-1.98.0-9
          # This pinned compiler predates early metadata.
        __CARGO_HEADSTART: no
      run: |
        toolchain_bin="$(dirname "$(rustup which rustc)")"
        rustup_bin="$(dirname "$(command -v rustup)")"
        # Exclude runner-provided native-tool shims from the trusted-cache fixture.
        export PATH="$toolchain_bin:$rustup_bin:/usr/bin:/bin:/usr/sbin:/sbin"
        rustc -Vv
        clippy-driver -V
        testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
        if [[ -z "$testsuite" ]]; then
          echo 'compiled Cargo integration test binary was not found' >&2
          exit 1
        fi
        # The stable-built testsuite marks these nightly tests ignored at compile time.
        "$testsuite" profiles::ohm_default_debuginfo --include-ignored --nocapture
        for test in \
          worktree_import_requires_cloning \
          bundled_clippy_isolation_defaults_follow_actual_snapshot_cloning \
          bundled_clippy_preserves_ordinary_seeds_without_importing_lint_state \
          clippy_isolation_overrides_are_inherited_and_child_flags_take_precedence \
          forced_clippy_isolation_preserves_compiler_trust_rejections \
          clippy_wrapper_scripts_still_deny_the_whole_seed; do
          "$testsuite" "ohm_worktree::$test" --exact --include-ignored --nocapture
        done
        if [[ "$RUNNER_OS" == Linux ]]; then
          "$testsuite" ohm_linker::ohm_defaults_select_wild_and_allow_lld \
            --exact --include-ignored --nocapture
          "$testsuite" rustflags::ohm_defaults_reexpand_derive_after_native_input_changes \
            --exact --nocapture
        fi

    - name: Audit the two historical profile selectors separately from the original suite
      env:
        RUSTUP_TOOLCHAIN: ohm-1.98.0-9
          # This pinned compiler predates early metadata.
        __CARGO_HEADSTART: no
      run: |
        set -euo pipefail
        toolchain_bin="$(dirname "$(rustup which rustc)")"
        rustup_bin="$(dirname "$(command -v rustup)")"
        export PATH="$toolchain_bin:$rustup_bin:/usr/bin:/bin:/usr/sbin:/sbin"
        testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
        test -n "$testsuite"
        for case in profile_settings::ohm_default_debuginfo profile_settings::ohm_default_debuginfo_respects_overrides; do
          "$testsuite" "$case" --exact --include-ignored --list | grep -Fx "$case: test"
          "$testsuite" "$case" --exact --include-ignored --nocapture | tee "$RUNNER_TEMP/$case.log"
          grep -Fx "test $case ... ok" "$RUNNER_TEMP/$case.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/$case.log"
        done
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.repository == 'astral-experiments/ohm-cargo' && github.ref == 'refs/heads/charlie/qa-302-307-exact-linux-20261101' }}
