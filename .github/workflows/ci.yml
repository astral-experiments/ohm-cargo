name: CI

on:
  push:
    branches:
      - ohm-1.98.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.98.0

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +"$RUST_VERSION" fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'depot-macos-15' && 'namespace-profile-macos-15' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04-8, depot-macos-15]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
      - name: Check lints
        run: cargo +"$RUST_VERSION" clippy --workspace --all-targets --no-deps -- -D warnings

  cargo-tests:
    name: Cargo tests (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'depot-macos-15' && 'namespace-profile-macos-15' || matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-24.04-16
            other: i686-unknown-linux-gnu
          - os: depot-macos-15
            other: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_VERSION" "${{ matrix.other }}" wasm32-unknown-unknown
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libsecret-1-0 libsecret-1-dev
      - name: Run Cargo unit and integration tests
        run: cargo +"$RUST_VERSION" test -p cargo

  workspace-tests:
    name: Workspace tests
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Run workspace tests
        run: cargo +"$RUST_VERSION" test --workspace --exclude cargo --exclude benchsuite --exclude resolver-tests

  resolver:
    name: Resolver tests
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Run resolver tests
        run: cargo +"$RUST_VERSION" test -p resolver-tests

  schema:
    name: Schema tests
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Run schema tests
        run: cargo +"$RUST_VERSION" test -p cargo-util-schemas --features unstable-schema
