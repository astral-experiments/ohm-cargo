name: Qualify exact Ohm profile gates on Linux and macOS
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_VERSION: 1.99.0
jobs:
  cargo-tests:
    name: Exact profile gates and missing-name control (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'depot-macos-15' && 'namespace-profile-macos-15' || 'namespace-profile-ubuntu-24-04-16' }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: depot-ubuntu-24.04-16
          other: i686-unknown-linux-gnu
        - os: depot-macos-15
          other: x86_64-apple-darwin
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
      with:
        ref: 8cd671651e53f01855602865b2f92640def73d34
    - name: Verify the source and workflow blob
      run: |
        set -eu
        test "$(git rev-parse HEAD)" = 8cd671651e53f01855602865b2f92640def73d34
        test "$(git rev-parse HEAD:.github/workflows/ci.yml)" = 4606dc456d79eae073249e511906f4f258c7b5c6
        git rev-parse HEAD HEAD^{tree}
    - name: Install Rust
      run: |
        # Keep compiled-in test scratch paths outside this repository and any
        # `target` component, for Git discovery and automatic shared-build admission.
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-tests" >> "$GITHUB_ENV"
        rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
        rustup target add --toolchain "$RUST_VERSION" "${{ matrix.other }}" wasm32-unknown-unknown
    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y gcc-multilib libsecret-1-0 libsecret-1-dev
    - name: Build the stable Cargo testsuite
      run: cargo +"$RUST_VERSION" test -p cargo --test testsuite --no-run
    - name: Install Ohm for Clippy worktree coverage
      env:
        OHM_VERSION: ohm-1.98.0-9
        OHM_INSTALLER_SHA256: 573e00024783ab952f7c2d629f12f9e0ba61be96843f7e692dc056642a72affe
      run: |
        installer="$RUNNER_TEMP/ohm-clippy-installer.sh"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "$installer" \
          "https://labs.astral.sh/ohm/releases/$OHM_VERSION/install.sh"
        printf '%s  %s\n' "$OHM_INSTALLER_SHA256" "$installer" | shasum -a 256 --check
        sh "$installer"
    - name: Run profile and bundled Clippy worktree tests with Ohm
      env:
        RUSTUP_TOOLCHAIN: ohm-1.98.0-9
      run: |
        toolchain_bin="$(dirname "$(rustup which rustc)")"
        rustup_bin="$(dirname "$(command -v rustup)")"
        # Exclude runner-provided native-tool shims from the trusted-cache fixture.
        export PATH="$toolchain_bin:$rustup_bin:/usr/bin:/bin:/usr/sbin:/sbin"
        rustc -Vv
        clippy-driver -V
        testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
        if [[ -z "$testsuite" ]]; then
          echo 'compiled Cargo integration test binary was not found' >&2
          exit 1
        fi
        # The stable-built testsuite marks these nightly tests ignored at compile time.
        for test in \
          profile_settings::ohm_default_debuginfo \
          profile_settings::ohm_default_debuginfo_respects_overrides; do
          "$testsuite" "$test" --exact --include-ignored --list | grep -Fx "$test: test"
          "$testsuite" "$test" --exact --include-ignored --nocapture
        done
        for test in \
          worktree_import_requires_cloning \
          bundled_clippy_isolation_defaults_follow_actual_snapshot_cloning \
          bundled_clippy_preserves_ordinary_seeds_without_importing_lint_state \
          clippy_isolation_overrides_are_inherited_and_child_flags_take_precedence \
          forced_clippy_isolation_preserves_compiler_trust_rejections \
          clippy_wrapper_scripts_still_deny_the_whole_seed; do
          "$testsuite" "ohm_worktree::$test" --exact --include-ignored --nocapture
        done
        if [[ "$RUNNER_OS" == Linux ]]; then
          "$testsuite" ohm_linker::ohm_defaults_select_wild_and_allow_lld \
            --exact --include-ignored --nocapture
        fi

    - name: Check the original zero match and a missing second test
      env:
        RUSTUP_TOOLCHAIN: ohm-1.98.0-9
      run: |
        set -euo pipefail
        toolchain_bin="$(dirname "$(rustup which rustc)")"
        rustup_bin="$(dirname "$(command -v rustup)")"
        export PATH="$toolchain_bin:$rustup_bin:/usr/bin:/bin:/usr/sbin:/sbin"
        testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
        test -x "$testsuite"
        output="$RUNNER_TEMP/profile-controls"
        mkdir -p "$output"
        git rev-parse HEAD HEAD^{tree} > "$output/checkout.txt"
        rustc -Vv > "$output/pinned-rustc.txt"
        shasum -a 256 "$testsuite" > "$output/harness.sha256"
        "$testsuite" --list > "$output/inventory.txt"
        grep -Fx 'profile_settings::ohm_default_debuginfo: test' "$output/inventory.txt"
        grep -Fx 'profile_settings::ohm_default_debuginfo_respects_overrides: test' "$output/inventory.txt"
        "$testsuite" profiles::ohm_default_debuginfo --include-ignored --nocapture | tee "$output/old-selector.txt"
        grep -F 'test result: ok. 0 passed; 0 failed;' "$output/old-selector.txt"
        cat > "$output/negative-gate.sh" <<'MISSING_GATE'
        testsuite=$1
        for test in \
          profile_settings::ohm_default_debuginfo \
          profile_settings::ohm_default_debuginfo_deliberately_missing_for_qa; do
          "$testsuite" "$test" --exact --include-ignored --list | grep -Fx "$test: test"
          "$testsuite" "$test" --exact --include-ignored --nocapture
        done
        MISSING_GATE
        if bash -e -o pipefail "$output/negative-gate.sh" "$testsuite" > "$output/missing-name.txt" 2>&1; then
          echo 'missing test was accepted' >&2
          exit 1
        else
          status=$?
        fi
        echo "$status" | tee "$output/missing-name.status"
        test "$status" = 1
        cat "$output/missing-name.txt"
        grep -F 'test profile_settings::ohm_default_debuginfo ... ok' "$output/missing-name.txt"
    - name: Keep the controls
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: profile-gates-${{ runner.os }}
        path: ${{ runner.temp }}/profile-controls
        retention-days: 30
        if-no-files-found: error
    timeout-minutes: 60
